<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>ロック解除</title>
    <script type="module" src="./unlock.ts"></script>
  </head>
  <body class="w-72 bg-white p-4 text-slate-900">
    <h1 class="text-sm font-semibold">Form Autofill のロックを解除</h1>
    <form id="unlock" class="mt-3 space-y-3" novalidate>
      <input name="passphrase" type="password" class="field" placeholder="パスフレーズ" autocomplete="current-password" autofocus />
      <button type="submit" class="w-full rounded-md bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-700 disabled:opacity-50">
        解除して入力
      </button>
      <p id="message" role="status" class="text-xs text-red-600"></p>
    </form>
    <button id="open-options" type="button" class="mt-2 text-xs text-slate-500 underline">設定を開く</button>
  </body>
</html>
