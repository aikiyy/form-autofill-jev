<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><title>レストラン予約（label の for が欄と一致しない・国番号つき電話）</title></head>
<body>
<!-- 実在の予約フォームの構造を再現: label[for] が欄の id と一致せず関連付いていない。ふりがな欄の name が last_name、漢字欄が kanji_last_name -->
<form>
  <div id="user-form">
    <input type="hidden" name="reservation[customer][is_single_name]" value="false">
    <div class="row row-narrow">
      <label class="control-label col-sm-3" for="last_name">なまえ (ふりがな) <span class="label label-danger">必須</span></label>
      <div class="col-sm-7"><div class="row">
        <div class="col-sm-6"><input class="form-control" placeholder="せい (ふりがな)" type="text" name="reservation[customer][last_name]" id="reservation_customer_last_name"></div>
        <div class="col-sm-6"><input class="form-control" placeholder="めい (ふりがな)" type="text" name="reservation[customer][first_name]" id="reservation_customer_first_name"></div>
      </div></div>
    </div>
    <div class="row form-group">
      <label class="control-label col-sm-3" for="kanji_last_name">名前 (漢字)</label>
      <div class="col-sm-7"><div class="row">
        <div class="col-sm-6"><input class="form-control" placeholder="氏" type="text" name="reservation[customer][kanji_last_name]" id="reservation_customer_kanji_last_name"></div>
        <div class="col-sm-6"><input class="form-control" placeholder="名" type="text" name="reservation[customer][kanji_first_name]" id="reservation_customer_kanji_first_name"></div>
      </div></div>
    </div>
    <div class="form-group phone-fields">
      <label class="control-label col-sm-3" for="reservation_customer_phone">携帯電話 <span class="label label-danger">必須</span></label>
      <div class="col-sm-7"><div class="row"><div class="col-sm-6">
        <!-- 国番号は JavaScript（intl-tel-input）が欄の前に描画する。国一覧は非表示 -->
        <div class="iti iti--allow-dropdown iti--separate-dial-code">
          <div class="iti__flag-container">
            <div class="iti__selected-flag" role="combobox" title="Japan (日本): +81"><div class="iti__flag iti__jp"></div><div class="iti__selected-dial-code">+81</div><div class="iti__arrow"></div></div>
            <ul class="iti__country-list iti__hide" hidden>
              <li class="iti__country"><span class="iti__country-name">United States</span><span class="iti__dial-code">+1</span></li>
              <li class="iti__country"><span class="iti__country-name">Japan (日本)</span><span class="iti__dial-code">+81</span></li>
            </ul>
          </div>
          <input class="form-control" maxlength="20" type="tel" name="reservation[customer][phone]" id="reservation_customer_phone">
        </div>
      </div></div></div>
    </div>
    <div class="form-group email-fields">
      <label class="control-label col-sm-3" for="reservation_customer_email">Eメール</label>
      <div class="col-sm-7"><input class="form-control" placeholder="Eメール" type="email" name="reservation[customer][email]" id="reservation_customer_email"></div>
    </div>
    <input type="hidden" name="reservation[customer][birthday]" id="reservation_customer_birthday">
    <input type="password" name="reservation[customer][password]" placeholder="パスワードを作る">
  </div>
</form>
</body>
</html>
