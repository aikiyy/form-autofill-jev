<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><title>配送先入力（分割欄型）</title></head>
<body>
<form>
  <div class="row">
    <span class="label">郵便番号</span>
    〒<input name="zip1" type="text" maxlength="3" size="3"> - <input name="zip2" type="text" maxlength="4" size="4">
  </div>
  <div class="row">
    <span class="label">都道府県</span>
    <select name="pref">
      <option value="">選択してください</option>
      <option value="1">北海道</option>
      <option value="13">東京都</option>
      <option value="27">大阪府</option>
    </select>
  </div>
  <div class="row">
    <span class="label">市区町村</span><input name="addr1" type="text">
  </div>
  <div class="row">
    <span class="label">番地</span><input name="addr2" type="text">
  </div>
  <div class="row">
    <span class="label">建物名・部屋番号</span><input name="addr3" type="text">
  </div>
  <div class="row">
    <span class="label">電話番号</span>
    <input name="tel1" type="tel" maxlength="4"> - <input name="tel2" type="tel" maxlength="4"> - <input name="tel3" type="tel" maxlength="4">
  </div>
</form>
</body>
</html>
