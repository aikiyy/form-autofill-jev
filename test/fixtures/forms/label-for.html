<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><title>会員登録（label[for]型）</title></head>
<body>
<form>
  <label for="sei">姓</label><input id="sei" name="sei" type="text">
  <label for="mei">名</label><input id="mei" name="mei" type="text">
  <label for="sei_kana">セイ</label><input id="sei_kana" name="sei_kana" type="text"><span>（全角カナ）</span>
  <label for="mei_kana">メイ</label><input id="mei_kana" name="mei_kana" type="text"><span>（全角カナ）</span>
  <label for="mail">メールアドレス</label><input id="mail" name="mail" type="email">
  <label for="mail2">メールアドレス（確認用）</label><input id="mail2" name="mail_confirm" type="email">
  <label>電話番号 <input name="tel" type="tel" placeholder="090-1234-5678"></label>
  <label for="pw">パスワード</label><input id="pw" name="password" type="password">
  <input type="hidden" name="csrf" value="x">
  <input id="hiddenByStyle" name="honeypot" type="text" style="display:none">
  <input name="coupon" type="text" disabled>
  <button type="submit">登録</button>
</form>
</body>
</html>
