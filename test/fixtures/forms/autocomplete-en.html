<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>Checkout (autocomplete)</title></head>
<body>
<form>
  <input name="a" autocomplete="family-name" aria-label="Last name">
  <input name="b" autocomplete="given-name" aria-label="First name">
  <input name="c" type="email" autocomplete="email" placeholder="you@example.com">
  <input name="d" type="tel" autocomplete="tel">
  <input name="e" autocomplete="postal-code" aria-label="ZIP">
  <input name="f" autocomplete="address-level1" aria-label="State / Prefecture">
  <input name="g" autocomplete="address-level2" aria-label="City">
  <input name="h" autocomplete="address-line1" aria-label="Address line 1">
  <input name="i" autocomplete="address-line2" aria-label="Address line 2">
  <span id="bday-label">Birthday</span><input name="j" type="date" autocomplete="bday" aria-labelledby="bday-label">
</form>
</body>
</html>
